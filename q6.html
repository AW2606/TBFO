<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Successful - Project Chimera</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        font-size: 16px;
      }

      body {
        box-sizing: border-box;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* General responsive adjustments */
      img, svg, video, canvas, iframe, object, embed {
        max-width: 100%;
        height: auto;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #e6f7ff;
        color: #0066cc;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* Calming Background */
      .success-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #e6f7ff 0%,
          #b3e5fc 50%,
          #81d4fa 100%
        );
        z-index: 1;
        animation: backgroundGlow 6s ease-in-out infinite alternate;
      }

      @keyframes backgroundGlow {
        0% {
          filter: brightness(1) saturate(1);
        }
        100% {
          filter: brightness(1.1) saturate(1.2);
        }
      }

      /* Stable Data Streams */
      .data-streams {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        opacity: 0.3;
      }

      .data-stream {
        position: absolute;
        width: 2px;
        height: 100px;
        background: linear-gradient(
          180deg,
          transparent,
          #00bcd4,
          #4dd0e1,
          transparent
        );
        animation: dataFlow linear infinite;
        opacity: 0.6;
      }

      @keyframes dataFlow {
        0% {
          transform: translateY(-100px);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(100vh);
          opacity: 0;
        }
      }

      /* Organized Grid Pattern */
      .grid-pattern {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
            rgba(0, 188, 212, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(0, 188, 212, 0.1) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: 2;
        animation: gridStabilize 8s ease-in-out infinite;
      }

      @keyframes gridStabilize {
        0%,
        100% {
          opacity: 0.3;
          transform: translate(0, 0);
        }
        50% {
          opacity: 0.5;
          transform: translate(1px, 1px);
        }
      }

      /* Floating Particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #00bcd4;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(0, 188, 212, 0.6);
        animation: particleFloat linear infinite;
      }

      @keyframes particleFloat {
        0% {
          transform: translateY(100vh) translateX(0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
          transform: translateY(90vh) translateX(0) scale(1);
        }
        90% {
          opacity: 1;
          transform: translateY(10vh) translateX(0) scale(1);
        }
        100% {
          transform: translateY(-10vh) translateX(0) scale(0);
          opacity: 0;
        }
      }

      /* Main Content Container */
      .success-content {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 2rem;
      }

      /* Mission Successful Text */
      .mission-successful {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(3rem, 8vw, 5.5rem);
        font-weight: 700;
        color: #0066cc;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin-bottom: 3rem;
        position: relative;
        text-shadow: 0 0 20px rgba(0, 188, 212, 0.4),
          0 0 40px rgba(0, 188, 212, 0.2);
        animation: successGlow 4s ease-in-out infinite alternate;
      }

      @keyframes successGlow {
        0% {
          text-shadow: 0 0 20px rgba(0, 188, 212, 0.4),
            0 0 40px rgba(0, 188, 212, 0.2);
          transform: scale(1);
        }
        100% {
          text-shadow: 0 0 30px rgba(0, 188, 212, 0.6),
            0 0 60px rgba(0, 188, 212, 0.3), 0 0 80px rgba(0, 188, 212, 0.1);
          transform: scale(1.02);
        }
      }

      .mission-successful::before {
        content: "";
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        background: linear-gradient(
          45deg,
          rgba(0, 188, 212, 0.1),
          rgba(77, 208, 225, 0.1)
        );
        border-radius: 10px;
        z-index: -1;
        animation: successAura 3s ease-in-out infinite alternate;
      }

      @keyframes successAura {
        0% {
          opacity: 0.3;
          transform: scale(1);
        }
        100% {
          opacity: 0.6;
          transform: scale(1.05);
        }
      }

      /* Victory Narrative */
      .victory-narrative {
        font-family: "Inter", sans-serif;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        color: #0277bd;
        font-weight: 500;
        margin-bottom: 4rem;
        max-width: 900px;
        line-height: 1.8;
        text-shadow: 0 0 10px rgba(2, 119, 189, 0.3);
        animation: narrativeAppear 2s ease-out;
        background: rgba(255, 255, 255, 0.2);
        padding: 2rem;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 188, 212, 0.2);
        box-shadow: 0 10px 30px rgba(0, 188, 212, 0.1);
      }

      @keyframes narrativeAppear {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Highlight important text */
      .highlight {
        color: #00acc1;
        font-weight: 600;
        text-shadow: 0 0 15px rgba(0, 172, 193, 0.4);
      }

      /* Play Again Button */
      .play-again-btn {
        font-family: "Orbitron", sans-serif;
        font-size: 1.4rem;
        font-weight: 600;
        padding: 1.8rem 4rem;
        border: 3px solid #00bcd4;
        background: linear-gradient(
          135deg,
          rgba(0, 188, 212, 0.1),
          rgba(77, 208, 225, 0.2)
        );
        color: #0066cc;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
        text-decoration: none;
        display: inline-block;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(0, 188, 212, 0.2),
          inset 0 0 20px rgba(255, 255, 255, 0.1);
        animation: buttonReady 3s ease-in-out infinite alternate;
        min-height: 70px;
        min-width: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes buttonReady {
        0% {
          box-shadow: 0 8px 25px rgba(0, 188, 212, 0.2),
            inset 0 0 20px rgba(255, 255, 255, 0.1);
          transform: translateY(0);
        }
        100% {
          box-shadow: 0 12px 35px rgba(0, 188, 212, 0.3),
            inset 0 0 30px rgba(255, 255, 255, 0.2);
          transform: translateY(-2px);
        }
      }

      .play-again-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        transition: left 0.6s;
      }

      /* Brilliant Hover Effect */
      .play-again-btn:hover {
        background: linear-gradient(
          135deg,
          rgba(0, 188, 212, 0.3),
          rgba(77, 208, 225, 0.4)
        );
        border-color: #4dd0e1;
        color: #ffffff;
        box-shadow: 0 15px 50px rgba(0, 188, 212, 0.5),
          inset 0 0 40px rgba(255, 255, 255, 0.3),
          0 0 60px rgba(0, 188, 212, 0.4);
        transform: translateY(-5px) scale(1.05);
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }

      .play-again-btn:hover::before {
        left: 100%;
      }

      /* Success Indicators */
      .success-indicators {
        position: absolute;
        top: 2rem;
        right: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        z-index: 6;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        background: rgba(255, 255, 255, 0.3);
        padding: 0.8rem 1.5rem;
        border-radius: 25px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 188, 212, 0.3);
        font-weight: 500;
        color: #0277bd;
        animation: indicatorSlide 1s ease-out;
      }

      @keyframes indicatorSlide {
        0% {
          opacity: 0;
          transform: translateX(50px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .status-icon {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4caf50;
        box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
        animation: statusPulse 2s ease-in-out infinite;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.2);
        }
      }

      /* Celebration Effects */
      .celebration-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 4;
        pointer-events: none;
        background: radial-gradient(
            circle at 20% 30%,
            rgba(0, 188, 212, 0.05) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(77, 208, 225, 0.05) 0%,
            transparent 50%
          );
        animation: celebrationShimmer 8s ease-in-out infinite alternate;
      }

      @keyframes celebrationShimmer {
        0% {
          opacity: 0.3;
          filter: hue-rotate(0deg);
        }
        100% {
          opacity: 0.6;
          filter: hue-rotate(20deg);
        }
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .success-content {
          padding: 1.5rem;
        }

        .mission-successful {
          letter-spacing: 4px;
          margin-bottom: 2.5rem;
        }

        .victory-narrative {
          margin-bottom: 3.5rem;
          padding: 1.8rem;
        }

        .play-again-btn {
          padding: 1.6rem 3.2rem;
          font-size: 1.25rem;
        }
      }

      @media (max-width: 768px) {
        .success-content {
          padding: 1rem;
        }

        .mission-successful {
          letter-spacing: 3px;
          margin-bottom: 2rem;
        }

        .victory-narrative {
          margin-bottom: 3rem;
          padding: 1.4rem;
        }

        .play-again-btn {
          padding: 1.3rem 2.5rem;
          font-size: 1.1rem;
        }

        .success-indicators {
          position: static;
          flex-direction: row;
          justify-content: center;
          margin-bottom: 2rem;
        }
      }

      @media (max-width: 480px) {
        .success-content {
          padding: 0.8rem;
        }

        .mission-successful {
          letter-spacing: 2px;
          font-size: clamp(2.2rem, 8vw, 3rem);
        }

        .victory-narrative {
          font-size: clamp(1.1rem, 3vw, 1.5rem);
          padding: 1rem;
          margin-bottom: 2.5rem;
        }

        .play-again-btn {
          padding: 1rem 1.8rem;
          font-size: 0.95rem;
          min-height: 55px;
        }

        .success-indicators {
          flex-direction: column;
          align-items: center;
        }
      }
      
      @media (max-width: 320px) {
        .mission-successful {
          font-size: clamp(2rem, 8vw, 2.5rem);
        }

        .victory-narrative {
          font-size: clamp(1rem, 3vw, 1.3rem);
        }

        .play-again-btn {
          padding: 0.9rem 1.5rem;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Layers -->
    <div class="success-background"></div>
    <div class="grid-pattern"></div>
    <div class="celebration-overlay"></div>

    <!-- Data Streams -->
    <div class="data-streams" id="dataStreams"></div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Success Indicators -->
    <div class="success-indicators">
      <div class="status-indicator" style="animation-delay: 0.5s">
        <div class="status-icon"></div>
        <span>Nexus Disabled</span>
      </div>
      <div class="status-indicator" style="animation-delay: 1s">
        <div class="status-icon"></div>
        <span>Threat Neutralized</span>
      </div>
      <div class="status-indicator" style="animation-delay: 1.5s">
        <div class="status-icon"></div>
        <span>World Secured</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="success-content">
      <h1 class="mission-successful">Mission Successful</h1>

      <p class="victory-narrative">
        The <span class="highlight">Nexus core</span> is disabled. The global
        threat is over. The world is safe again, thanks to you,
        <span class="highlight">Agent Alex</span>.
      </p>

      <a href="index.html" class="play-again-btn" onclick="playAgain(event)">
        Beranda
      </a>
    </div>

    <script>
            // Create stable data streams
            function createDataStream() {
              const container = document.getElementById("dataStreams");
              const stream = document.createElement("div");
              stream.className = "data-stream";

              stream.style.left = Math.random() * 100 + "%";
              stream.style.animationDuration = Math.random() * 3 + 4 + "s";
              stream.style.animationDelay = Math.random() * 2 + "s";

              container.appendChild(stream);

              setTimeout(() => {
                if (stream.parentNode) {
                  stream.parentNode.removeChild(stream);
                }
              }, 8000);
            }

            // Create floating particles
            function createParticle() {
              const container = document.getElementById("particles");
              const particle = document.createElement("div");
              particle.className = "particle";

              particle.style.left = Math.random() * 100 + "%";
              particle.style.animationDuration = Math.random() * 8 + 6 + "s";
              particle.style.animationDelay = Math.random() * 3 + "s";

              // Random gentle movement
              const drift = (Math.random() - 0.5) * 100;
              particle.style.setProperty("--drift", drift + "px");

              container.appendChild(particle);

              setTimeout(() => {
                if (particle.parentNode) {
                  particle.parentNode.removeChild(particle);
                }
              }, 12000);
            }

            // Play Again button functionality
            function playAgain(event) {
        const btn = event.currentTarget;

        // Brilliant activation effect
        btn.style.transform = "translateY(-8px) scale(1.1)";
        btn.style.boxShadow =
          "0 20px 60px rgba(0, 188, 212, 0.8), 0 0 100px rgba(0, 188, 212, 0.6)";
        btn.style.background =
          "linear-gradient(135deg, rgba(0, 188, 212, 0.5), rgba(77, 208, 225, 0.6))";
        btn.style.color = "#ffffff";
        btn.style.textShadow = "0 0 25px rgba(255, 255, 255, 1)";

        // Create expanding light rings
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const ring = document.createElement("div");
            ring.style.position = "absolute";
            ring.style.top = "50%";
            ring.style.left = "50%";
            ring.style.width = "0";
            ring.style.height = "0";
            ring.style.border = "3px solid rgba(0, 188, 212, 0.6)";
            ring.style.borderRadius = "50%";
            ring.style.transform = "translate(-50%, -50%)";
            ring.style.animation = "expandRing 1.5s ease-out";
            btn.appendChild(ring);

            setTimeout(() => ring.remove(), 1500);
          }, i * 200);
        }

        // Screen blessing effect
        const blessing = document.createElement("div");
        blessing.style.position = "fixed";
        blessing.style.top = "0";
        blessing.style.left = "0";
        blessing.style.width = "100vw";
        blessing.style.height = "100vh";
        blessing.style.background =
          "radial-gradient(circle, rgba(0, 188, 212, 0.2) 0%, transparent 70%)";
        blessing.style.zIndex = "9999";
        blessing.style.animation = "blessingWave 1.5s ease-out";
        document.body.appendChild(blessing);

        setTimeout(() => blessing.remove(), 1500);

        // Navigate setelah animasi selesai
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      }

              // Success confirmation
              setTimeout(() => {
                alert(
                  "Thank you for playing Project Chimera!\n\nYour heroic actions have saved the world.\n\nIn a real implementation, this would restart the game with new challenges."
                );
              }, 1000);
            }

            // Add CSS for effects
            const style = document.createElement("style");
            style.textContent = `
                  @keyframes expandRing {
                      to {
                          width: 300px;
                          height: 300px;
                          opacity: 0;
                      }
                  }

                  @keyframes blessingWave {
                      0% { opacity: 0; transform: scale(0.5); }
                      50% { opacity: 1; transform: scale(1); }
                      100% { opacity: 0; transform: scale(1.2); }
                  }

                  .particle {
                      animation-name: particleFloat;
                      animation-timing-function: ease-in-out;
                  }

                  @keyframes particleFloat {
                      0% {
                          transform: translateY(100vh) translateX(0) scale(0);
                          opacity: 0;
                      }
                      10% {
                          opacity: 1;
                          transform: translateY(90vh) translateX(var(--drift, 0px)) scale(1);
                      }
                      90% {
                          opacity: 1;
                          transform: translateY(10vh) translateX(var(--drift, 0px)) scale(1);
                      }
                      100% {
                          transform: translateY(-10vh) translateX(var(--drift, 0px)) scale(0);
                          opacity: 0;
                      }
                  }
              `;
            document.head.appendChild(style);

            // Initialize effects
            // Continuous stable data streams
            setInterval(createDataStream, 800);

            // Initial data streams
            for (let i = 0; i < 12; i++) {
              setTimeout(createDataStream, i * 200);
            }

            // Continuous particles
            setInterval(createParticle, 1500);

            // Initial particles
            for (let i = 0; i < 8; i++) {
              setTimeout(createParticle, i * 500);
            }

            // Gentle background effects
            let glowIntensity = 1;
            setInterval(() => {
              glowIntensity = 0.9 + Math.random() * 0.2;
              const background = document.querySelector(".success-background");
              if (background) {
                background.style.filter = `brightness(${glowIntensity}) saturate(${glowIntensity})`;
              }
            }, 3000);

            // Celebration entrance effect
            document.addEventListener("DOMContentLoaded", function () {
              // Gentle entrance animations
              const content = document.querySelector(".success-content");
              content.style.animation = "contentAppear 2s ease-out";

              // Staggered indicator animations
              const indicators = document.querySelectorAll(".status-indicator");
              indicators.forEach((indicator, index) => {
                indicator.style.animationDelay = index * 0.5 + 1 + "s";
              });
            });

            // Add entrance animation
            const entranceStyle = document.createElement("style");
            entranceStyle.textContent = `
                  @keyframes contentAppear {
                      0% {
                          opacity: 0;
                          transform: translateY(50px) scale(0.9);
                      }
                      100% {
                          opacity: 1;
                          transform: translateY(0) scale(1);
                      }
                  }
              `;
            document.head.appendChild(entranceStyle);
    </script>
