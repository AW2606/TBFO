<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet the Developers - Project Chimera</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        box-sizing: border-box;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Rajdhani", sans-serif;
        background: #0a1428;
        color: #ffffff;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* Cyberpunk Background */
      .cyberpunk-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
            circle at 25% 25%,
            rgba(0, 255, 255, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 75% 75%,
            rgba(255, 0, 255, 0.08) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0a1428 0%, #1a2332 50%, #0f1b2a 100%);
        z-index: 1;
        animation: backgroundPulse 8s ease-in-out infinite alternate;
      }

      @keyframes backgroundPulse {
        0% {
          filter: brightness(1) hue-rotate(0deg);
        }
        100% {
          filter: brightness(1.1) hue-rotate(5deg);
        }
      }

      /* Animated Grid Lines */
      .grid-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        opacity: 0.1;
      }

      .grid-line {
        position: absolute;
        background: linear-gradient(90deg, transparent, #00ffff, transparent);
        animation: gridScan 4s linear infinite;
      }

      .grid-line.horizontal {
        width: 100%;
        height: 1px;
      }

      .grid-line.vertical {
        width: 1px;
        height: 100%;
      }

      @keyframes gridScan {
        0% {
          opacity: 0;
          transform: translateX(-100%);
        }
        50% {
          opacity: 0.3;
        }
        100% {
          opacity: 0;
          transform: translateX(100%);
        }
      }

      /* Main Container */
      .developers-container {
        position: relative;
        z-index: 5;
        padding: 4rem 2rem;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Main Title */
      .main-title {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 900;
        color: #00ffff;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin-bottom: 4rem;
        position: relative;
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.6),
          0 0 40px rgba(0, 255, 255, 0.4), 0 0 60px rgba(0, 255, 255, 0.2);
        animation: titleGlow 3s ease-in-out infinite alternate;
      }

      @keyframes titleGlow {
        0% {
          text-shadow: 0 0 20px rgba(0, 255, 255, 0.6),
            0 0 40px rgba(0, 255, 255, 0.4), 0 0 60px rgba(0, 255, 255, 0.2);
        }
        100% {
          text-shadow: 0 0 30px rgba(0, 255, 255, 0.8),
            0 0 60px rgba(0, 255, 255, 0.6), 0 0 90px rgba(0, 255, 255, 0.4);
        }
      }

      .main-title::before,
      .main-title::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 100px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #00ffff, transparent);
        animation: titleAccent 2s ease-in-out infinite alternate;
      }

      .main-title::before {
        left: -120px;
      }

      .main-title::after {
        right: -120px;
      }

      @keyframes titleAccent {
        0% {
          width: 100px;
          opacity: 0.6;
        }
        100% {
          width: 150px;
          opacity: 1;
        }
      }

      /* Team Grid */
      .team-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4rem;
        position: relative;
      }

      /* Neon Separators */
      .team-grid::before,
      .team-grid::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(0, 255, 255, 0.6) 20%,
          rgba(0, 255, 255, 0.8) 50%,
          rgba(0, 255, 255, 0.6) 80%,
          transparent
        );
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        animation: separatorPulse 3s ease-in-out infinite alternate;
      }

      .team-grid::before {
        left: 33.33%;
        transform: translateX(-50%);
      }

      .team-grid::after {
        left: 66.66%;
        transform: translateX(-50%);
      }

      @keyframes separatorPulse {
        0% {
          box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
          opacity: 0.7;
        }
        100% {
          box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
          opacity: 1;
        }
      }

      /* Developer Card */
      .developer-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
        background: rgba(10, 30, 50, 0.3);
        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        position: relative;
        transition: all 0.4s ease;
        animation: cardAppear 1s ease-out;
        animation-fill-mode: both;
      }

      .developer-card:nth-child(1) {
        animation-delay: 0.2s;
      }
      .developer-card:nth-child(2) {
        animation-delay: 0.4s;
      }
      .developer-card:nth-child(3) {
        animation-delay: 0.6s;
      }

      @keyframes cardAppear {
        0% {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .developer-card::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        background: linear-gradient(
          45deg,
          rgba(0, 255, 255, 0.3),
          rgba(255, 0, 255, 0.2),
          rgba(0, 255, 255, 0.3)
        );
        border-radius: 20px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .developer-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
          0 0 30px rgba(0, 255, 255, 0.3);
      }

      .developer-card:hover::before {
        opacity: 1;
      }

      /* Hexagonal Photo Frame */
      .hexagon-frame {
        width: 200px;
        height: 200px;
        position: relative;
        margin-bottom: 2rem;
      }

      .hexagon {
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 255, 0.2),
          rgba(0, 150, 255, 0.1)
        );
        position: relative;
        border-radius: 20px;
        transform: rotate(30deg);
        border: 3px solid rgba(0, 255, 255, 0.5);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.3),
          inset 0 0 30px rgba(0, 255, 255, 0.1);
        animation: hexagonRotate 10s linear infinite;
      }

      @keyframes hexagonRotate {
        0% {
          transform: rotate(30deg);
        }
        100% {
          transform: rotate(390deg);
        }
      }

      .hexagon::before,
      .hexagon::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: inherit;
        border: inherit;
        border-radius: inherit;
        box-shadow: inherit;
      }

      .hexagon::before {
        transform: rotate(60deg);
      }

      .hexagon::after {
        transform: rotate(-60deg);
      }

      .developer-photo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-30deg);
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        z-index: 2;
      }

      /* Developer Info */
      .developer-name {
        font-family: "Orbitron", sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        background: linear-gradient(45deg, #ffffff, #00ffff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .student-id {
        font-size: 1.2rem;
        font-weight: 500;
        color: #66ccff;
        letter-spacing: 1px;
        opacity: 0.9;
      }

      /* Corner Decorations */
      .corner-decoration {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid rgba(0, 255, 255, 0.4);
      }

      .corner-decoration.top-left {
        top: 15px;
        left: 15px;
        border-right: none;
        border-bottom: none;
      }

      .corner-decoration.top-right {
        top: 15px;
        right: 15px;
        border-left: none;
        border-bottom: none;
      }

      .corner-decoration.bottom-left {
        bottom: 15px;
        left: 15px;
        border-right: none;
        border-top: none;
      }

      .corner-decoration.bottom-right {
        bottom: 15px;
        right: 15px;
        border-left: none;
        border-top: none;
      }

      /* Floating UI Elements */
      .ui-element {
        position: absolute;
        color: rgba(0, 255, 255, 0.3);
        font-family: "Orbitron", sans-serif;
        font-size: 0.8rem;
        animation: uiFloat 6s ease-in-out infinite alternate;
      }

      @keyframes uiFloat {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0.3;
        }
        100% {
          transform: translateY(-20px) rotate(5deg);
          opacity: 0.6;
        }
      }

      .ui-element.ui-1 {
        top: 20%;
        left: 5%;
        animation-delay: 0s;
      }

      .ui-element.ui-2 {
        top: 60%;
        right: 8%;
        animation-delay: 2s;
      }

      .ui-element.ui-3 {
        bottom: 30%;
        left: 10%;
        animation-delay: 4s;
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .team-grid {
          gap: 3rem;
        }

        .main-title::before,
        .main-title::after {
          display: none;
        }

        .hexagon-frame {
          width: 160px;
          height: 160px;
        }

        .developer-photo {
          width: 100px;
          height: 100px;
        }
      }

      @media (max-width: 768px) {
        .team-grid {
          grid-template-columns: 1fr;
          gap: 2rem;
        }

        .team-grid::before,
        .team-grid::after {
          display: none;
        }

        .developers-container {
          padding: 2rem 1rem;
        }

        .main-title {
          margin-bottom: 3rem;
          letter-spacing: 3px;
        }

        .developer-card {
          padding: 1.5rem;
        }

        .hexagon-frame {
          width: 140px;
          height: 140px;
        }

        .developer-photo {
          width: 80px;
          height: 80px;
        }

        .developer-name {
          font-size: 1.5rem;
        }

        .student-id {
          font-size: 1.1rem;
        }
      }

      @media (max-width: 480px) {
        .main-title {
          letter-spacing: 2px;
        }

        .developer-card {
          padding: 1rem;
        }

        .hexagon-frame {
          width: 120px;
          height: 120px;
        }

        .developer-photo {
          width: 70px;
          height: 70px;
        }

        .developer-name {
          font-size: 1.3rem;
          letter-spacing: 1px;
        }

        .student-id {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <div class="cyberpunk-background"></div>

    <!-- Grid Overlay -->
    <div class="grid-overlay">
      <div
        class="grid-line horizontal"
        style="top: 20%; animation-delay: 0s"
      ></div>
      <div
        class="grid-line horizontal"
        style="top: 60%; animation-delay: 2s"
      ></div>
      <div
        class="grid-line vertical"
        style="left: 30%; animation-delay: 1s"
      ></div>
      <div
        class="grid-line vertical"
        style="left: 70%; animation-delay: 3s"
      ></div>
    </div>

    <!-- Floating UI Elements -->
    <div class="ui-element ui-1">[SYS_INIT]</div>
    <div class="ui-element ui-2">[DEV_TEAM]</div>
    <div class="ui-element ui-3">[ONLINE]</div>

    <!-- Main Container -->
    <div class="developers-container">
      <!-- Main Title -->
      <h1 class="main-title">Meet the Developers</h1>

      <!-- Team Grid -->
      <div class="team-grid">
        <!-- Developer 1 -->
        <div class="developer-card">
          <div class="corner-decoration top-left"></div>
          <div class="corner-decoration bottom-right"></div>

          <div class="hexagon-frame">
            <div class="hexagon"></div>
            <img
              src="img/WIN_20250828_22_47_55_Pro.jpg"
              alt="Adhitya Warman"
              class="developer-photo"
            />
          </div>

          <div class="developer-name">Adhitya Warman</div>
          <div class="student-id">NIM : 124140007</div>
        </div>

        <!-- Developer 2 -->
        <div class="developer-card">
          <div class="corner-decoration top-left"></div>
          <div class="corner-decoration bottom-right"></div>

          <div class="hexagon-frame">
            <div class="hexagon"></div>
            <img
              src="img/Gambar WhatsApp 2025-09-30 pukul 22.41.13_add90a38.jpg"
              alt="Jojo Marpaung"
              class="developer-photo"

          </div>

          <div class="developer-name">Jojo Marpaung</div>
          <div class="student-id">NIM : 124140191</div>
        </div>

        <!-- Developer 3 -->
        <div class="developer-card">
          <div class="corner-decoration top-left"></div>
          <div class="corner-decoration bottom-right"></div>

          <div class="hexagon-frame">
            <div class="hexagon"></div>
            <img
              src="img/Gambar WhatsApp 2025-09-30 pukul 22.41.35_f66ca4f6.jpg"
              alt="Melvin Satria Gunanta Sitepu"
              class="developer-photo"
            />
          </div>

          <div class="developer-name">Melvin Satria Gunanta Sitepu</div>
          <div class="student-id">NIM : 124140173</div>
        </div>
      </div>

      <!-- Kembali Button -->
      <div style="display: flex; justify-content: center; margin-top: 3rem">
        <a
          href="welcome.html"
          class="kembali-btn"
          style="
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ffff;
            background: transparent;
            border: 3px solid #00ffff;
            padding: 1rem 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4),
              inset 0 0 20px rgba(0, 255, 255, 0.1);
            animation: buttonPulse 2s infinite;
          "
        >
          Kembali
        </a>
      </div>
    </div>

    <script>
      // Enhanced background effects
      let backgroundShift = 0;
      setInterval(() => {
        backgroundShift += 0.3;
        const background = document.querySelector(".cyberpunk-background");
        if (background) {
          background.style.filter = `hue-rotate(${backgroundShift}deg) brightness(${
            1 + Math.sin(backgroundShift * 0.05) * 0.1
          })`;
        }
      }, 100);

      // Card hover effects with sound simulation
      document.querySelectorAll(".developer-card").forEach((card) => {
        card.addEventListener("mouseenter", function () {
          // Add subtle glow effect to hexagon
          const hexagon = this.querySelector(".hexagon");
          if (hexagon) {
            hexagon.style.boxShadow =
              "0 0 50px rgba(0, 255, 255, 0.6), inset 0 0 50px rgba(0, 255, 255, 0.2)";
            hexagon.style.borderColor = "rgba(0, 255, 255, 0.8)";
          }

          // Enhance name glow
          const name = this.querySelector(".developer-name");
          if (name) {
            name.style.textShadow = "0 0 20px rgba(255, 255, 255, 0.8)";
          }
        });

        card.addEventListener("mouseleave", function () {
          // Reset effects
          const hexagon = this.querySelector(".hexagon");
          if (hexagon) {
            hexagon.style.boxShadow =
              "0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.1)";
            hexagon.style.borderColor = "rgba(0, 255, 255, 0.5)";
          }

          const name = this.querySelector(".developer-name");
          if (name) {
            name.style.textShadow = "0 0 10px rgba(255, 255, 255, 0.3)";
          }
        });
      });

      // Dynamic grid line generation
      function createRandomGridLine() {
        const gridOverlay = document.querySelector(".grid-overlay");
        const line = document.createElement("div");
        line.className = "grid-line";

        if (Math.random() > 0.5) {
          line.classList.add("horizontal");
          line.style.top = Math.random() * 100 + "%";
        } else {
          line.classList.add("vertical");
          line.style.left = Math.random() * 100 + "%";
        }

        line.style.animationDuration = Math.random() * 3 + 2 + "s";
        gridOverlay.appendChild(line);

        setTimeout(() => {
          if (line.parentNode) {
            line.parentNode.removeChild(line);
          }
        }, 5000);
      }

      // Create random grid lines periodically
      setInterval(createRandomGridLine, 3000);

      // Hexagon interaction effects
      document.querySelectorAll(".hexagon").forEach((hexagon) => {
        hexagon.addEventListener("click", function () {
          // Create ripple effect
          const ripple = document.createElement("div");
          ripple.style.position = "absolute";
          ripple.style.top = "50%";
          ripple.style.left = "50%";
          ripple.style.width = "0";
          ripple.style.height = "0";
          ripple.style.border = "3px solid rgba(0, 255, 255, 0.8)";
          ripple.style.borderRadius = "50%";
          ripple.style.transform = "translate(-50%, -50%)";
          ripple.style.animation = "hexagonRipple 1s ease-out";
          ripple.style.pointerEvents = "none";

          this.appendChild(ripple);

          setTimeout(() => ripple.remove(), 1000);
        });
      });

      // Add CSS for hexagon ripple effect
      const style = document.createElement("style");
      style.textContent = `
            @keyframes hexagonRipple {
                to {
                    width: 200px;
                    height: 200px;
                    opacity: 0;
                }
            }
        `;
      document.head.appendChild(style);

      // Entrance animations on scroll/load
      document.addEventListener("DOMContentLoaded", function () {
        const cards = document.querySelectorAll(".developer-card");

        // Stagger the entrance animations
        cards.forEach((card, index) => {
          card.style.opacity = "0";
          card.style.transform = "translateY(50px) scale(0.9)";

          setTimeout(() => {
            card.style.transition = "all 0.8s ease-out";
            card.style.opacity = "1";
            card.style.transform = "translateY(0) scale(1)";
          }, (index + 1) * 300);
        });
      });

      // UI element random updates
      const uiMessages = [
        "[SYS_INIT]",
        "[LOADING]",
        "[READY]",
        "[ONLINE]",
        "[DEV_TEAM]",
        "[ACTIVE]",
        "[SECURE]",
        "[CONNECTED]",
      ];

      setInterval(() => {
        const uiElements = document.querySelectorAll(".ui-element");
        uiElements.forEach((element) => {
          if (Math.random() < 0.3) {
            element.textContent =
              uiMessages[Math.floor(Math.random() * uiMessages.length)];
          }
        });
      }, 4000);
    </script>
